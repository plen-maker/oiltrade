name: Build All

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name "OilTrade-WebEditor" webeditor.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OilTrade-WebEditor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip3 install pyinstaller
      - run: pyinstaller --onefile --windowed --name "OilTrade-WebEditor-Intel" webeditor.py
      - run: mkdir dmg_tmp && cp -r dist/OilTrade-WebEditor-Intel.app dmg_tmp/
      - run: hdiutil create -volname "OilTrade WebEditor" -srcfolder dmg_tmp -ov -format UDZO dist/OilTrade-WebEditor-Intel.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OilTrade-WebEditor-Intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip3 install pyinstaller
      - run: pyinstaller --onefile --windowed --name "OilTrade-WebEditor-Silicon" webeditor.py
      - run: mkdir dmg_tmp && cp -r dist/OilTrade-WebEditor-Silicon.app dmg_tmp/
      - run: hdiutil create -volname "OilTrade WebEditor" -srcfolder dmg_tmp -ov -format UDZO dist/OilTrade-WebEditor-Silicon.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OilTrade-WebEditor-Silicon.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_NAME: ${{ github.event.release.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install deps
        run: |
          echo "legacy-peer-deps=true" >> .npmrc
          npm install
          npm install -D typescript
      - name: Set version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          python3 -c "
content = open('src/App.jsx').read()
content = content.replace('__APP_VERSION__', '$VERSION')
open('src/App.jsx', 'w').write(content)
print('Done:', '$VERSION')
"
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - name: Rename and upload APK
        run: |
          SAFE=$(echo "$RELEASE_NAME" | tr ' ' '-')
          cp android/app/build/outputs/apk/debug/app-debug.apk "${SAFE}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
