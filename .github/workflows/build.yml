name: Build All

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build EXE
        run: pip install pyinstaller && pyinstaller --onefile --windowed --name "OilTrade-WebEditor" webeditor.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OilTrade-WebEditor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build DMG Intel
        run: |
          pip3 install pyinstaller
          pyinstaller --onefile --windowed --name "OilTrade-WebEditor-Intel" webeditor.py
          mkdir dmg_tmp
          cp -r "dist/OilTrade-WebEditor-Intel.app" dmg_tmp/
          hdiutil create -volname "OilTrade WebEditor" -srcfolder dmg_tmp -ov -format UDZO dist/OilTrade-WebEditor-Intel.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OilTrade-WebEditor-Intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build DMG Silicon
        run: |
          pip3 install pyinstaller
          pyinstaller --onefile --windowed --name "OilTrade-WebEditor-Silicon" webeditor.py
          mkdir dmg_tmp
          cp -r "dist/OilTrade-WebEditor-Silicon.app" dmg_tmp/
          hdiutil create -volname "OilTrade WebEditor" -srcfolder dmg_tmp -ov -format UDZO dist/OilTrade-WebEditor-Silicon.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OilTrade-WebEditor-Silicon.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install deps
        run: |
          echo "legacy-peer-deps=true" >> .npmrc
          npm install
          npm install -D typescript
      - name: Set version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/__APP_VERSION__/$VERSION/g" src/App.jsx
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - name: Rename APK
        run: |
          RNAME="${{ github.event.release.name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${RNAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/${{ github.event.release.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
