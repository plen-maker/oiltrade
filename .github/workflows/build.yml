name: Build APK

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install --legacy-peer-deps && npm install -D typescript --legacy-peer-deps

      - name: Install TypeScript
        run: npm install -D typescript

      - name: Convert capacitor config
        run: |
          cat capacitor.config.ts | node -e "
            const fs = require('fs');
            const content = fs.readFileSync('capacitor.config.ts','utf8');
            const appIdMatch = content.match(/appId:\s*['\"\`](.+?)['\"\`]/);
            const appNameMatch = content.match(/appName:\s*['\"\`](.+?)['\"\`]/);
            const webDirMatch = content.match(/webDir:\s*['\"\`](.+?)['\"\`]/);
            const config = {
              appId: appIdMatch?.[1] || 'com.oiltrade.app',
              appName: appNameMatch?.[1] || 'OilTrade',
              webDir: webDirMatch?.[1] || 'dist'
            };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
            console.log('Created capacitor.config.json:', JSON.stringify(config));
          "

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}